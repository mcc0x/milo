name: Release tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      recipient:
        description: Optional public X.509 PEM certificate (base64, one line) to retain tested main or release/prepare-* candidates encrypted
        required: false
        type: string
      distribution_counts:
        description: Enable the pinned production counts URL in an encrypted release/prepare-* candidate
        type: boolean
        default: false

permissions:
  contents: read

env:
  MILO_COUNTS_ENDPOINT: ''
  MILO_TELEMETRY: '0'

jobs:
  macos-changes:
    name: Decide whether macOS tests are needed
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.changes.outputs.needed }}
    steps:
      - name: Require sealed release prep for distribution counts
        if: inputs.distribution_counts && (!startsWith(github.ref, 'refs/heads/release/prepare-') || inputs.recipient == '')
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          needed=$(python3 .github/ci/macos-needed.py "$GITHUB_EVENT_NAME" "$BASE" "$HEAD")
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

  portable:
    name: Linux tests on minimum Rust
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.91.0 --profile minimal
      - run: command -v sqlite3 || (sudo apt-get update && sudo apt-get install -y sqlite3)
      - name: Test installers on Linux
        run: sh tests/install.sh
      - run: cargo +1.91.0 check --locked --all-targets --all-features
      - run: cargo +1.91.0 test --locked
      - name: Read and edit in a standalone tmux pane
        run: |
          command -v tmux || (sudo apt-get update && sudo apt-get install -y tmux)
          sh tests/standalone-tmux.sh target/debug/milo
      - name: Verify the source package builds
        run: cargo +1.91.0 package --locked

  linux-candidate:
    name: Standalone Linux x86-64 release candidate
    needs: macos-changes
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reproduce in pinned Jammy containers and install without a compiler or network
        env:
          MILO_DISTRIBUTION_COUNTS: ${{ inputs.distribution_counts && '1' || '' }}
        run: sh .github/ci/qualify-linux.sh "$RUNNER_TEMP/assets"
      - name: Exercise the installed executable in tmux and headless settings
        run: |
          sh tests/linux-install.sh
          sh tests/linux-candidate.sh "$RUNNER_TEMP/assets"
      - name: Verify the pinned reporting endpoint in the sealed ELF
        if: inputs.distribution_counts
        run: grep -aFq 'https://counts-production.up.railway.app/v1/counts' "$RUNNER_TEMP/assets/milo-x86_64-unknown-linux-gnu"
      - name: Seal the tested Linux release files for offline qualification
        if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/prepare-')) && inputs.recipient != ''
        env:
          RECIPIENT: ${{ inputs.recipient }}
        run: |
          printf '%s' "$RECIPIENT" | base64 -d > "$RUNNER_TEMP/recipient.pem"
          cd "$RUNNER_TEMP/assets"
          tar -cf "$RUNNER_TEMP/milo-linux.tar" milo-x86_64-unknown-linux-gnu install-linux.sh SHA256SUMS
          openssl smime -encrypt -aes256 -binary -outform DER -in "$RUNNER_TEMP/milo-linux.tar" \
            -out "$RUNNER_TEMP/milo-linux.tar.p7m" "$RUNNER_TEMP/recipient.pem"
          cat SHA256SUMS
          (cd "$RUNNER_TEMP" && sha256sum milo-linux.tar)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/prepare-')) && inputs.recipient != ''
        with:
          name: milo-linux-x86_64-${{ github.sha }}
          path: ${{ runner.temp }}/milo-linux.tar.p7m
          if-no-files-found: error
          retention-days: 14

  anonymous-counts:
    name: Anonymous counts with disposable Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.5
      - run: rustup toolchain install 1.91.0 --profile minimal
      - name: Test the receiver, private dashboard and native first-launch gate on loopback
        env:
          RUSTUP_TOOLCHAIN: 1.91.0
          DO_NOT_TRACK: 1
        run: |
          test -x "$(pg_config --bindir)/initdb" || (sudo apt-get update && sudo apt-get install -y postgresql)
          export PG_BIN="$(pg_config --bindir)"
          pg=hosted/counts/scripts/pg-ephemeral.sh
          "$pg" bun test ./hosted/counts/counts.integration.ts
          export MILO_TEST_WITHOUT_CURL="$RUNNER_TEMP/without-curl"
          cat > "$MILO_TEST_WITHOUT_CURL" <<'SH'
          #!/bin/sh
          exec sudo -n unshare --mount --propagation private sh -ec '
            mount --bind /dev/null /usr/bin/curl
            test ! -x /usr/bin/curl
            exec setpriv --reuid="$1" --regid="$2" --clear-groups env -i HOME="$3" PATH=/usr/bin:/bin TERM=xterm-256color "$4" outline
          ' sh "$(id -u)" "$(id -g)" "$HOME" "$1"
          SH
          chmod 700 "$MILO_TEST_WITHOUT_CURL"
          "$pg" python3 tests/anonymous-counts.py
      - name: Build the standalone receiver image and check that it fails closed
        run: |
          docker build -t milo-counts:ci hosted/counts
          status=0
          docker run --rm --network none milo-counts:ci || status=$?
          test "$status" = 1

  dashboard:
    name: Dashboard production export
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: dashboard/package.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.5
      - name: Test official pairing without provider credentials
        run: bun test
        working-directory: hosted
      - name: Verify the relay image with isolated networking and disposable storage
        run: |
          docker build -f hosted/Dockerfile -t milo-relay:ci .
          sh tests/relay-container.sh milo-relay:ci
      - run: bun install --frozen-lockfile && bun run build
        working-directory: dashboard
        env:
          NEXT_TELEMETRY_DISABLED: 1

  docs-bundle:
    name: Published documentation matches source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 site/bundle-docs.py --check

  website:
    name: Website production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/package.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile && bun test && bun run build
        working-directory: site
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Check the static export
        run: test -f dist/index.html && test -f dist/404.html && test -f dist/llms-full.txt
        working-directory: site

  rex-fixtures:
    name: Rex Lua 5.1 fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - run: cargo test --locked --bin milo setup::layout::tests::rex_lua_fixtures -- --ignored --exact

  test:
    needs: macos-changes
    # Never satisfy the tag ruleset's check name with a skipped job.
    name: ${{ needs.macos-changes.outputs.needed == 'false' && 'macOS not needed for these paths' || 'Apple Silicon release tests' }}
    if: ${{ !cancelled() && (!inputs.distribution_counts || needs.macos-changes.result == 'success') && (needs.macos-changes.result != 'success' || needs.macos-changes.outputs.needed != 'false') }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test installers
        run: sh tests/install.sh
      - name: Verify the embedded dashboard matches its source
        run: node dashboard/scripts/bundle.mjs --check
      # Only a debug build accepts the loopback endpoints and disposable keychains.
      - name: Exercise alert worker recovery with disposable destinations
        run: cargo test --locked --test alerts
      - name: Test release build on Apple Silicon
        run: |
          test "$(uname -m)" = arm64
          cargo test --release --locked
      - name: Smoke-test packaged settings in Chromium
        env:
          RUSTUP_TOOLCHAIN: 1.91.0
          MILO_DISTRIBUTION_COUNTS: ${{ inputs.distribution_counts && '1' || '' }}
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustc -V
          sh macos/build-menu.sh --release
          test ! -e target/local-menu/Milo.app/Contents/Resources/ProfilePaths.plist
          python3 tests/menu-archive.py
          sh tests/menubar.sh
          smoke_dir="$RUNNER_TEMP/milo-web-smoke"
          npm install --prefix "$smoke_dir" --no-save --no-audit --no-fund --ignore-scripts playwright-core@1.65.1
          export PLAYWRIGHT_BROWSERS_PATH="$smoke_dir/browsers"
          node "$smoke_dir/node_modules/playwright-core/cli.js" install --only-shell chromium
          NODE_PATH="$smoke_dir/node_modules" node tests/web-smoke.cjs target/local-menu/milo
      - name: Stage and verify the installer for the tested Mac binary
        run: |
          sh .github/ci/stage-macos.sh target/local-menu/milo "$RUNNER_TEMP/assets"
          cmp target/local-menu/milo "$RUNNER_TEMP/assets/milo-aarch64-apple-darwin"
          (cd "$RUNNER_TEMP/assets" && shasum -a 256 -c SHA256SUMS)
      - name: Verify the pinned reporting endpoint in both Mac executables
        if: inputs.distribution_counts
        run: |
          grep -aFq 'https://counts-production.up.railway.app/v1/counts' target/local-menu/milo
          grep -aFq 'https://counts-production.up.railway.app/v1/counts' target/local-menu/Milo.app/Contents/Resources/Tools/milo
      - name: Qualify the staged Mac reporting binary against isolated TLS
        if: inputs.distribution_counts
        run: |
          assets="$RUNNER_TEMP/assets"
          pin=$(awk '$2 == "milo-aarch64-apple-darwin" { print $1 }' "$assets/SHA256SUMS")
          bash tests/distribution-counts-macos/runner.sh "$assets/milo-aarch64-apple-darwin" "$pin" counts-production.up.railway.app
      - name: Seal the tested Mac release files for offline qualification
        if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/prepare-')) && inputs.recipient != ''
        env:
          RECIPIENT: ${{ inputs.recipient }}
        run: |
          printf '%s' "$RECIPIENT" | /usr/bin/base64 -D > "$RUNNER_TEMP/recipient.pem"
          (cd "$RUNNER_TEMP/assets" && COPYFILE_DISABLE=1 tar -cf "$RUNNER_TEMP/milo-macos.tar" milo-aarch64-apple-darwin install.sh SHA256SUMS)
          openssl smime -encrypt -aes256 -binary -outform DER -in "$RUNNER_TEMP/milo-macos.tar" \
            -out "$RUNNER_TEMP/milo-macos.tar.p7m" "$RUNNER_TEMP/recipient.pem"
          swiftc --version
          xcrun --sdk macosx --show-sdk-version
          shasum -a 256 target/local-menu/menu.tar.gz
          cat "$RUNNER_TEMP/assets/SHA256SUMS"
          (cd "$RUNNER_TEMP" && shasum -a 256 milo-macos.tar)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/prepare-')) && inputs.recipient != ''
        with:
          name: milo-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/milo-macos.tar.p7m
          if-no-files-found: error
          retention-days: 14
