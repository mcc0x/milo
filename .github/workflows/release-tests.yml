name: Apple Silicon hosted TLS cleanup rehearsal
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diagnostic:
    name: Synthetic Apple Silicon TLS and cleanup diagnostic
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: bash tests/distribution-counts-macos/runner.sh
