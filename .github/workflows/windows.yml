name: Windows

# Native Windows only: the MSVC target built and tested on a Windows host. This is not WSL,
# a cross-compile from Linux, or a Windows Rex client attached to another host.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      recipient:
        description: Base64 of a PEM certificate. When set, the tested executable is encrypted to it and kept for one day.
        required: false
        default: ''

permissions:
  contents: read

jobs:
  native:
    name: Native Windows x86-64 tests
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: never
    steps:
      # Keep the checked-out bytes as committed: fixtures and the dashboard bundle are hashed.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.91.0 --profile minimal
      - name: Record the host
        run: |
          (Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber, OSArchitecture | Format-List | Out-String).Trim()
          rustc +1.91.0 -vV
          git --version
      - run: cargo +1.91.0 check --locked --all-targets
      - name: Run the tests in a private temporary folder
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: cargo +1.91.0 test --locked
      - name: Edit, save and refuse an external change in a pseudoconsole
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: cargo +1.91.0 test --locked --test windows_console -- --nocapture
      - name: Record the tested executable
        run: |
          git rev-parse HEAD
          (Get-FileHash target\debug\milo.exe -Algorithm SHA256).Hash
      # Only its recipient can open the copy kept: a public artifact would publish a binary.
      - name: Seal the tested executable for its recipient
        if: github.event_name == 'workflow_dispatch' && inputs.recipient != ''
        env:
          RECIPIENT: ${{ inputs.recipient }}
        run: |
          $openssl = "$env:ProgramFiles\Git\usr\bin\openssl.exe"
          & $openssl version
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\recipient.pem", [Convert]::FromBase64String($env:RECIPIENT))
          & $openssl smime -encrypt -aes256 -binary -outform DER -in target\debug\milo.exe -out "$env:RUNNER_TEMP\milo.exe.p7m" "$env:RUNNER_TEMP\recipient.pem"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Get-FileHash "$env:RUNNER_TEMP\milo.exe.p7m" -Algorithm SHA256).Hash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch' && inputs.recipient != ''
        with:
          name: milo-windows-x86_64-debug-${{ github.sha }}
          path: ${{ runner.temp }}/milo.exe.p7m
          if-no-files-found: error
          retention-days: 1
