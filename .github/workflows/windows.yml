name: Windows hosted transport rehearsal
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diagnostic:
    name: Synthetic Windows loopback TLS diagnostic
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      MILO_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: ./tests/distribution-counts-windows/qualify.ps1
