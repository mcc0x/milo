<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#d8e7fe">
  <title>Milo settings</title>
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png">
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="frame topbar-inner">
      <img class="brand-lockup" src="/milo.webp" width="510" height="192" alt="Milo" fetchpriority="high">
      <nav class="social-links" aria-label="Social links"><a target="_blank" rel="noopener noreferrer" class="social-link" href="https://github.com/mcc0x/milo" aria-label="milo on GitHub"><svg class="source-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg></a><a target="_blank" rel="noopener noreferrer" class="social-link" href="https://x.com/0xmcc" aria-label="Follow 0xmcc on X"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3L12 14.6 5.5 22H2.3l7.4-8.5L.8 2h6.5l4.5 6.8L18.9 2Zm-1.1 18h1.7L6.3 3.9H4.5L17.8 20Z"/></svg></a></nav>
    </div>
  </header>

  <div class="frame surface" id="editor" hidden>
    <button class="skip-link" id="skip-settings" type="button">Skip to settings</button>
  <footer class="actionbar" id="actionbar" hidden>
    <img src="/rex.png" width="20" height="20" alt="">
    <div id="context" class="context"></div>
    <span id="connection" class="connection sr-only"></span>
    <span id="version" class="version"></span>
  </footer>
    <div class="control-dock">
    <nav class="navigation" aria-label="Settings sections">
      <button type="button" data-page="layout" aria-current="page" aria-controls="settings-panel">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 8h18m-7 0v12m0-6h7"/></svg>
        <span>Layout<span class="nav-draft" hidden></span></span>
      </button>
      <button type="button" data-page="appearance" aria-controls="settings-panel">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path fill="currentColor" stroke="none" d="M12 4a8 8 0 0 1 0 16Z"/></svg>
        <span>Appearance<span class="nav-draft" hidden></span></span>
      </button>
      <button type="button" data-page="workflow" aria-controls="settings-panel">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 17V7m0 8c8 0 12-2 12-8"/><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/></svg>
        <span>Workflow<span class="nav-draft" hidden></span></span>
      </button>
      <button type="button" data-page="health" aria-controls="settings-panel">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 5h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"/><path d="M6 12h3l2-4 3 8 2-4h2"/></svg>
        <span>Health<span class="nav-draft" hidden></span></span>
      </button>
    </nav>
      <div class="dock-actions" aria-label="Draft actions" role="group">
        <button id="discard-all" class="button text-button draft-action" type="button" aria-label="Discard" title="Discard" disabled>
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg>
        </button>
        <button id="save-draft" class="button secondary draft-action" type="button" aria-label="Save" title="Save" disabled>
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m3.5 10 4.2 4.2L16.5 5.5"/></svg>
        </button>
        <button id="done" class="button primary" type="button" title="Stop the local editor">Done</button>
      </div>
    </div>
    <p class="sr-only" id="draft-status" role="status"></p>
    <p class="sr-only" id="health-status" role="status" aria-atomic="true"></p>

    <main class="editor-main">
      <h1 class="sr-only">Milo settings</h1>
      <div id="error-box" hidden>
        <p id="error"></p>
        <div class="button-row" id="error-actions" hidden>
          <button class="button secondary" id="retry" type="button">Retry edit</button>
          <button class="button text-button" id="drop-edit" type="button">Drop this edit</button>
          <button class="button text-button" id="reconnect" type="button">Reconnect</button>
        </div>
      </div>
        <section id="settings-panel" class="settings-panel" tabindex="-1"></section>
    </main>
  </div>

  <div class="frame opening" id="opening">
    <p id="opening-message" role="status">Opening your local settings…</p>
    <button class="button secondary" id="open-retry" type="button" hidden>Connect again</button>
  </div>
  <main id="closed" class="frame opening" hidden>
    <h1>Settings closed</h1>
    <p>Your local editor has stopped. You can close this tab.</p>
  </main>


  <dialog id="save-options" aria-labelledby="save-title">
    <h2 id="save-title">Save changes</h2>
    <p>Choose where to save each draft.</p>
    <div id="save-groups"></div>
    <form method="dialog" class="dialog-actions button-row"><button class="button secondary">Cancel</button></form>
  </dialog>
  <dialog id="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-note">
    <h2 id="confirm-title"></h2>
    <p id="confirm-note"></p>
    <div class="button-row dialog-actions">
      <button class="button secondary" id="confirm-cancel" type="button" autofocus>Keep editing</button>
      <button id="confirm-do" class="button danger" type="button"></button>
    </div>
  </dialog>
  <div class="toast-stack">
    <div class="toast" id="message" role="status" aria-atomic="true"></div>
    <div class="toast toast-error" id="alert-toast" role="alert" aria-atomic="true"></div>
  </div>
</body>
</html>
