<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Milo tile check</title>
<style>
  :root { color-scheme: light dark; font: 16px system-ui, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; border: 5px solid #197a74; padding: clamp(14px, 4vw, 38px); }
  h1 { margin: .35em 0; font-size: clamp(22px, 5vw, 38px); }
  input, button { font: inherit; padding: .5em; max-width: 100%; }
  label, output { display: block; margin: 1em 0 .3em; }
  a { color: inherit; }
</style>
<main>
  <small>LOCAL PLACEMENT FIXTURE</small>
  <h1>Right tile check</h1>
  <p>The green border marks the page edges. Compare it to the Rex header, divider and pane below the preview toolbar.</p>
  <label for="typing">Type here, then resize the divider.</label>
  <input id="typing" autocomplete="off" placeholder="Type a few words">
  <output id="dimensions" aria-label="Page dimensions"></output>
  <p><button type="button" id="count">Clicks: 0</button> · <a href="?page=2">Navigate</a></p>
</main>
<script>
  if (new URL(location.href).searchParams.has('page')) document.querySelector('h1').textContent = 'Second page';
  let clicks = 0;
  document.querySelector('#count').onclick = event => { event.currentTarget.textContent = `Clicks: ${++clicks}`; };
  const size = () => { document.querySelector('#dimensions').textContent = `Viewport: ${innerWidth} × ${innerHeight} CSS pixels`; };
  window.addEventListener('resize', size); size();
</script>
</html>
