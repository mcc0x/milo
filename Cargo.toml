[package]
name = "milo"
version = "0.1.9"
edition = "2024"
rust-version = "1.91"
description = "Terminal panes for browsing Git files and commits, reading code, and checking coding agent usage."
homepage = "https://usemilo.net"
repository = "https://github.com/mcc0x/milo"
license = "MIT"
keywords = ["terminal", "git", "tui", "rex", "code-reader"]
categories = ["command-line-utilities", "development-tools"]
# Shell test drivers require files from a Git checkout, not the Cargo archive.
# A leading slash names one path at the package root. Without it, a name such as
# README.md also matches every copy under an installed frontend dependency.
# A unit test reads the one file under hosted/, shared with the relay's tests.
include = [
    "/build.rs", "/dashboard/bundle/**", "/src/**", "/tests/**", "!/tests/*.sh",
    "/Cargo.lock", "/LICENSE", "/README.md", "/rustfmt.toml", "/hosted/milo-alert-texts.json",
]

[dependencies]
libc = "0.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(milo_menu_payload)', 'cfg(milo_distribution_counts)'] }
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"

[profile.release]
# Favour runtime speed in release builds.
opt-level = 3
# Optimise across crate boundaries.
lto = true
# Optimise the crate together rather than in separate units.
codegen-units = 1
# Remove symbols from the installed binary.
strip = true
