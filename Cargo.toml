[package]
name = "strata"
version = "0.1.0"
edition = "2021"
description = "A project's files in a terminal pane, coloured by what is not yet committed or pushed."
license = "MIT"

[dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
