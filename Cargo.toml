[package]
name = "milo"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "A terminal file tree with git status and a read-only file reader."
homepage = "https://usemilo.net"
license = "MIT"

[dependencies]
libc = "0.2"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"

[profile.release]
# Favour runtime speed in release builds.
opt-level = 3
# Optimise across crate boundaries.
lto = true
# Optimise the crate together rather than in separate units.
codegen-units = 1
# Omit stack unwinding to keep the binary smaller.
panic = "abort"
# Remove symbols from the installed binary.
strip = true
