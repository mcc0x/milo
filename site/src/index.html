          <div class="lockup">
            <img class="brand-lockup" src="./images/milo-lockup.webp" width="510" height="192" alt="" fetchpriority="high">

          </div>

        </header>
        <div class="intro">
          <div class="intro-copy">
            <p class="description">The little things that make <a class="rex" href="https://www.superlogical.com/rex"><img src="./images/rex.png" width="72" height="72" alt="">Rex</a> feel like home.</p>
            <p class="subtext">A file tree, commit history, diffs, and agent usage, right where you want them. Milo remembers how you like your panes.</p>
          </div>
          <div class="install">
            <span class="install-prompt" aria-hidden="true">$</span>
            <code id="install-command">brew install mcc0x/milo/milo</code>
            <button id="copy-command" type="button" aria-describedby="install-command">Copy</button>
          </div>
          <p id="copy-feedback" class="visually-hidden" role="status"></p>
        </div>

        <!-- A demo that plays by itself; its label says what it shows. -->
        <div class="terminal" id="demo" data-view="whole" data-still role="img" aria-label="A Rex window with milo’s outline, history and usage panes beside a coding agent at work">
          <div class="rex-titlebar">
            <span class="window-lights"><i></i><i></i><i></i></span>
            <span class="rex-tab">tidebook</span><span>Rex</span>
          </div>
          <div class="terminal-panes">
            <section class="term-pane outline">
              <div class="pane-body" id="outline-pane"></div>
            </section>
            <section class="term-pane history">
              <div class="pane-body" id="history-pane"></div>
            </section>
            <section class="term-pane usage">
              <div class="usage-strip">
                <span><img src="./images/codex.png" width="20" height="20" alt="Codex"><strong id="codex-usage"></strong></span>
                <span><img src="./images/claude.png" width="20" height="20" alt="Claude"><strong id="claude-usage"></strong></span>
              </div>
            </section>
            <section class="term-pane agent" id="agent-pane">
              <div class="agent-session" id="agent-session">
                <header class="agent-banner" id="agent-banner"></header>
                <div id="agent-transcript"></div>
              </div>
              <div class="agent-chrome">
                <div class="agent-activity" id="agent-activity" hidden></div>
                <div class="agent-composer">
                  <div class="composer-model" id="composer-model"></div>
                  <div class="composer-line">
                    <span class="composer-prompt" id="composer-prompt"></span>
                    <span><span class="composer-text" id="composer-text"></span><i class="composer-caret"></i><span class="composer-placeholder" id="composer-placeholder"></span></span>
                  </div>
                </div>
                <div class="composer-hint" id="composer-hint"></div>
              </div>
            </section>
            <section class="reader" id="reader-pane" hidden>
              <header class="pane-head"><span>›_ milo view weather.ts</span><i class="pane-tools"></i></header>
              <div class="reader-content" id="reader-content"></div>
            </section>
          </div>
        </div>
        <div class="demo-footer">
          <button class="caption-toggle" id="demo-playback" type="button" aria-controls="demo" aria-label="Pause demo" aria-pressed="false" title="Pause demo"><span class="caption" id="caption" aria-hidden="true"></span></button>
        </div>
